<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ---------- 渲染器 / 场景 / 相机 ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ---------- 可拖动光源配置（改光源参数看这里）----------
const DRAG_LIGHT_CONFIG = {
  color: 0xfff1dd,                        // 光源颜色
  intensity: 22,                          // 亮度（three r155+ 点光源为坎德拉单位，数值大是正常的）
  distance: 0,                            // 光照衰减半径，0 表示不限距离
  decay: 2,                               // 衰减指数，2 接近物理真实
  castShadow: false,                      // 是否投射阴影（点光源阴影较耗性能）
  position: { x: 0.38, y: 2.39, z: 3.61 },  // 初始位置（世界坐标）
  markerRadius: 0.15,                     // 拖动球半径，也是可点击范围的基础
  showMarker: false                       // 是否显示光源标记球（false = 隐藏，只保留光照效果）
};

// ---------- 灯光 ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97ad, 0.9));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(4, 6, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xaac4ff, 0.5);
rimLight.position.set(-5, 3, -4);
scene.add(rimLight);

// ---------- 可拖动点光源 ----------
const dragLight = new THREE.PointLight(
  DRAG_LIGHT_CONFIG.color,
  DRAG_LIGHT_CONFIG.intensity,
  DRAG_LIGHT_CONFIG.distance,
  DRAG_LIGHT_CONFIG.decay
);
dragLight.position.set(
  DRAG_LIGHT_CONFIG.position.x,
  DRAG_LIGHT_CONFIG.position.y,
  DRAG_LIGHT_CONFIG.position.z
);
dragLight.castShadow = DRAG_LIGHT_CONFIG.castShadow;
if (dragLight.castShadow) {
  dragLight.shadow.mapSize.set(1024, 1024);
  dragLight.shadow.bias = -0.002;
}
scene.add(dragLight);

// 拖动标记球（作为光源子对象，随光源一起移动）
const lightMarker = new THREE.Mesh(
  new THREE.SphereGeometry(DRAG_LIGHT_CONFIG.markerRadius, 20, 14),
  new THREE.MeshBasicMaterial({ color: DRAG_LIGHT_CONFIG.color, transparent: true, opacity: 0.95, depthTest: false })
);
lightMarker.renderOrder = 999; // 始终画在模型之上，方便抓取
dragLight.add(lightMarker);

// 外层柔光（径向渐变贴图），让光源看起来像一盏发光的灯
function makeGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.32)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const lightHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  color: DRAG_LIGHT_CONFIG.color,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false
}));
lightHalo.scale.setScalar(DRAG_LIGHT_CONFIG.markerRadius * 10);
lightHalo.renderOrder = 998;
dragLight.add(lightHalo);

// showMarker = false 时隐藏标记与光晕，仅保留光照效果
if (!DRAG_LIGHT_CONFIG.showMarker) {
  lightMarker.visible = false;
  lightHalo.visible = false;
}

// ---------- 地面阴影 ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.25 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 印花着色器注入 ----------
// 将图案以世界坐标平面投影的方式混合进面料材质：
// 图案随布料褶皱变形，并参与光照/阴影，与真实印花一致。
const printUniforms = {
  uPrintMap: { value: null },
  uPrintCenter: { value: new THREE.Vector2(0, 0) },
  uPrintSize: { value: new THREE.Vector2(1, 1) },
  uPrintZMin: { value: 0 },
  uPrintEnabled: { value: 0 },
  uPrintOpacity: { value: 1 }
};

function patchMaterial(m) {
  if (m.userData.printPatched) return;
  m.userData.printPatched = true;
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, printUniforms);

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>',
        '#include <common>\nvarying vec3 vPrintWorldPos;\nvarying vec3 vPrintWorldNormal;')
      .replace('#include <project_vertex>',
        `#include <project_vertex>
vPrintWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
vPrintWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>',
        `#include <common>
uniform sampler2D uPrintMap;
uniform vec2 uPrintCenter;
uniform vec2 uPrintSize;
uniform float uPrintZMin;
uniform float uPrintEnabled;
uniform float uPrintOpacity;
varying vec3 vPrintWorldPos;
varying vec3 vPrintWorldNormal;`)
      .replace('#include <map_fragment>',
        `#include <map_fragment>
if (uPrintEnabled > 0.5 && vPrintWorldPos.z > uPrintZMin) {
  vec2 puv = (vPrintWorldPos.xy - uPrintCenter) / uPrintSize + 0.5;
  float inRect = step(0.0, puv.x) * step(puv.x, 1.0) * step(0.0, puv.y) * step(puv.y, 1.0);
  float facing = smoothstep(0.05, 0.35, normalize(vPrintWorldNormal).z);
  vec4 pc = texture2D(uPrintMap, clamp(puv, 0.0, 1.0));
  diffuseColor.rgb = mix(diffuseColor.rgb, pc.rgb, pc.a * inRect * facing * uPrintOpacity);
}`);
  };
  m.customProgramCacheKey = () => 'tshirt-print';
  m.needsUpdate = true;
}

// ---------- 视图取景配置（移动端模型大小改这里）----------
const VIEW_CONFIG = {
  mobileMaxWidth: 768,   // 视口宽度 <= 该值视为移动端
  desktopScale: 0.75,    // 桌面端：模型占视口的比例（1 = 刚好铺满，越小模型越小）
  mobileScale: 0.58,     // 移动端：同上，该值就是移动端模型大小
  desktopY: 0.4,         // 桌面端相机高度偏移
  mobileY: 0.7           // 移动端相机高度偏移
};

function isMobileView() {
  return window.innerWidth <= VIEW_CONFIG.mobileMaxWidth;
}

// 按模型包围盒算出「刚好完整装进画面」的相机距离（同时考虑纵向和横向视野）
function fitDistance() {
  const h = modelInfo.size ? modelInfo.size.y : 7;
  const w = modelInfo.size ? modelInfo.size.x : 7;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const distV = (h / 2) / Math.tan(vFov / 2);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const distW = (w / 2) / Math.tan(hFov / 2);
  const scale = isMobileView() ? VIEW_CONFIG.mobileScale : VIEW_CONFIG.desktopScale;
  return Math.max(distV, distW) / scale;
}

// 正向取景
function applyFraming() {
  const mobile = isMobileView();
  const d = fitDistance();
  camera.position.set(0, mobile ? VIEW_CONFIG.mobileY : VIEW_CONFIG.desktopY, d);
  controls.target.set(0, 0, 0);
  controls.minDistance = d * 0.45;
  controls.maxDistance = d * 1.8;
  controls.update();
}

// 跨越断点时重新取景（保持当前视角方向）
let lastMobileView = isMobileView();
function handleViewportChange() {
  const mobile = isMobileView();
  if (mobile === lastMobileView) return;
  lastMobileView = mobile;

  const target = controls.target.clone();
  const dir = camera.position.clone().sub(target).normalize();
  const d = fitDistance();
  camera.position.copy(target).add(dir.multiplyScalar(d));
  camera.position.y = mobile ? VIEW_CONFIG.mobileY : VIEW_CONFIG.desktopY;
  controls.minDistance = d * 0.45;
  controls.maxDistance = d * 1.8;
  controls.update();
}

// ---------- GLB 模型加载 ----------
const knitMaterials = [];         // 针织面料材质（用于换色与印花注入）
const modelInfo = { size: null }; // 归一化后的包围盒尺寸
let pendingImage = null;          // 模型未加载完成时暂存上传的图片

const gltfLoader = new GLTFLoader();
// 模型经 meshopt 压缩，需挂载解码器
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

const loadingEl = document.getElementById('loading');

gltfLoader.load('./t-shirt2.min.glb', (gltf) => {
  const model = gltf.scene;

  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    // 隐藏模型自带的胸前 Logo 印花（PT_FABRIC 材质的贴片网格）
    if (mats.some((m) => m && /PT_FABRIC/i.test(m.name))) {
      o.visible = false;
      return;
    }
    mats.forEach((m) => {
      // 该模型的材质全部为衣物面料（棉/罗纹），统一收集用于换色与印花注入
      if (m && !knitMaterials.includes(m)) {
        m.roughness = 0.9;
        m.metalness = 0;
        knitMaterials.push(m);
      }
    });
  });

  // 归一化：高度约为 7，中心移到原点
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.scale.setScalar(7 / size.y);
  box.setFromObject(model);
  box.getSize(size);
  box.getCenter(center);
  model.position.sub(center);
  scene.add(model);

  modelInfo.size = size;
  ground.position.y = -size.y / 2 - 0.9;

  // 相机取景（模型大小见 VIEW_CONFIG，移动端会缩小）
  applyFraming();

  loadingEl.style.display = 'none';
  applyShirtColor(colorPicker.value); // 模型加载完成前可能已点击预设
  if (pendingImage) { applyImage(pendingImage); pendingImage = null; }
}, (xhr) => {
  // 加载进度：服务器返回 Content-Length 时显示百分比，否则显示已下载大小
  if (xhr.total > 0) {
    const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
    loadingEl.textContent = `模型加载中 ${pct}%`;
  } else {
    loadingEl.textContent = `模型加载中 ${(xhr.loaded / 1048576).toFixed(1)} MB`;
  }
}, (err) => {
  loadingEl.textContent = '模型加载失败，请刷新重试';
  console.error('模型加载失败', err);
});

// ---------- 印花贴图 ----------
let printTexture = null;
let printAspect = 1;
let fadeState = 'idle';      // idle / fading
let swapT = 0;                // 切换进度 0..1（淡出 + 淡入的总时间线）
let pendingNext = null;       // 待切换的新贴图 { texture, aspect }
let swapped = false;          // 时间线中点是否已替换贴图
let fadeOldColor = null;      // 切换前衣身颜色
let fadeTargetColor = null;   // 切换目标衣身颜色
let pendingLayout = null;     // 待切换的图案大小/位置（与贴图同时应用，避免旧图抖动）
let fadeIsRemoving = false;   // 当前过场是「移除」还是「切换」
const FADE_DURATION = 0.6;    // 整个切换过场时长（秒）

function updatePrintSize() {
  if (!modelInfo.size || !printTexture) return;
  const s = modelInfo.size;
  const scale = parseFloat(sizeRange.value);
  const maxW = s.x * 0.62, maxH = s.y * 0.38;
  let w = maxW, h = w / printAspect;
  if (h > maxH) { h = maxH; w = h * printAspect; }
  printUniforms.uPrintSize.value.set(w * scale, h * scale);
  // 基准位置在胸前中央，叠加上下左右偏移
  printUniforms.uPrintCenter.value.set(
    parseFloat(offsetXRange.value),
    s.y * 0.12 + parseFloat(offsetYRange.value)
  );
  printUniforms.uPrintZMin.value = 0; // 只印在前半身
}

function commitPrint(texture, aspect) {
  if (printTexture) printTexture.dispose();
  printTexture = texture;
  printAspect = aspect;
  knitMaterials.forEach(patchMaterial);
  printUniforms.uPrintMap.value = printTexture;
  printUniforms.uPrintEnabled.value = 1;
  // 新贴图就位后，再应用新的大小/位置，避免旧图先跳到新位置造成抖动
  if (pendingLayout) {
    sizeRange.value = pendingLayout.size;
    offsetXRange.value = pendingLayout.offsetX;
    offsetYRange.value = pendingLayout.offsetY;
    syncValueDisplays();
    pendingLayout = null;
  }
  updatePrintSize();
}

function applyImage(img, targetColorHex) {
  // 统一光栅化到显式尺寸的画布，避免 SVG 无内在尺寸等导致的纹理异常
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) { console.warn('图片尺寸无效，无法应用'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);

  if (!modelInfo.size) { pendingImage = canvas; return; }

  const newTexture = new THREE.CanvasTexture(canvas);
  newTexture.colorSpace = THREE.SRGBColorSpace;
  newTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const newAspect = w / h;

  const currentColor = knitMaterials[0] ? knitMaterials[0].color.clone() : new THREE.Color(colorPicker.value);
  const newColor = targetColorHex ? new THREE.Color(targetColorHex) : currentColor.clone();

  const hasPrint = printUniforms.uPrintEnabled.value > 0.5;

  // 没有旧图案时直接显示；否则进入过场：旧图淡出 + 衣身变色 + 新图淡入
  if (!hasPrint && fadeState === 'idle') {
    commitPrint(newTexture, newAspect);
    printUniforms.uPrintOpacity.value = 1;
    applyShirtColor(newColor);
  } else {
    if (pendingNext) { pendingNext.texture.dispose(); }
    pendingNext = { texture: newTexture, aspect: newAspect };
    fadeOldColor = currentColor;
    fadeTargetColor = newColor;
    swapT = 0;
    swapped = false;
    fadeIsRemoving = false;
    fadeState = 'fading';
  }
  removeBtn.disabled = false;
}

function removePrint() {
  if (printUniforms.uPrintEnabled.value < 0.5 && fadeState === 'idle') return;
  if (pendingNext) { pendingNext.texture.dispose(); pendingNext = null; }
  pendingLayout = null;
  fadeOldColor = knitMaterials[0] ? knitMaterials[0].color.clone() : new THREE.Color(colorPicker.value);
  fadeTargetColor = fadeOldColor.clone();
  swapT = 0;
  swapped = false;
  fadeIsRemoving = true;
  fadeState = 'fading';
}

// 切换动画：单条时间线驱动印花不透明度 + 衣身颜色插值
function updateFade(dt) {
  if (fadeState !== 'fading') return;
  swapT += dt / FADE_DURATION;
  if (swapT >= 1) swapT = 1;

  // 印花不透明度：前半段淡出到 0，中点替换贴图，后半段淡入到 1
  if (swapT < 0.5) {
    printUniforms.uPrintOpacity.value = 1 - swapT * 2;
  } else {
    if (!swapped && pendingNext) {
      const next = pendingNext;
      pendingNext = null;
      commitPrint(next.texture, next.aspect);
      swapped = true;
    }
    printUniforms.uPrintOpacity.value = (swapT - 0.5) * 2;
  }

  // 衣身颜色从旧色过渡到新色
  if (fadeOldColor && fadeTargetColor) {
    const c = fadeOldColor.clone().lerp(fadeTargetColor, swapT);
    applyShirtColor(c);
  }

  if (swapT >= 1) {
    // 只有「移除」过场才关闭印花；切换过场的新贴图已在中点提交，保持显示
    if (fadeIsRemoving) {
      printUniforms.uPrintEnabled.value = 0;
      printUniforms.uPrintMap.value = null;
      if (printTexture) { printTexture.dispose(); printTexture = null; }
      removeBtn.disabled = true;
    }
    fadeState = 'idle';
  }
}

// ---------- UI ----------
const uploadInput = document.getElementById('upload');
const removeBtn = document.getElementById('removeBtn');
const colorPicker = document.getElementById('colorPicker');
const sizeRange = document.getElementById('sizeRange');
const offsetXRange = document.getElementById('offsetXRange');
const offsetYRange = document.getElementById('offsetYRange');
const sizeVal = document.getElementById('sizeVal');
const offsetXVal = document.getElementById('offsetXVal');
const offsetYVal = document.getElementById('offsetYVal');

function syncValueDisplays() {
  sizeVal.textContent = parseFloat(sizeRange.value).toFixed(2);
  offsetXVal.textContent = parseFloat(offsetXRange.value).toFixed(2);
  offsetYVal.textContent = parseFloat(offsetYRange.value).toFixed(2);
}

function applyShirtColor(hex) {
  knitMaterials.forEach((m) => m.color.set(hex));
}

// ---------- 预设图案列表 ----------
// 列表数据维护在 presets.json，图片文件放在 images/ 目录
// 每项字段：url(图片路径)、name(名称)、color(T恤颜色)、size(图案大小)、offsetX/offsetY(左右/上下位置)
let presets = [];

const gallery = document.getElementById('gallery');
const galleryBar = document.getElementById('galleryBar');
const galleryPrev = document.getElementById('galleryPrev');
const galleryNext = document.getElementById('galleryNext');
const galleryToggle = document.getElementById('galleryToggle');
let activePresetIndex = -1;

// 箭头可用状态：滚动到两端时对应箭头置灰
function updateNavState() {
  const max = gallery.scrollWidth - gallery.clientWidth;
  galleryPrev.disabled = gallery.scrollLeft <= 1;
  galleryNext.disabled = gallery.scrollLeft >= max - 1;
}

function scrollGallery(dir) {
  gallery.scrollBy({ left: dir * gallery.clientWidth * 0.8, behavior: 'smooth' });
}

galleryPrev.addEventListener('click', () => scrollGallery(-1));
galleryNext.addEventListener('click', () => scrollGallery(1));
gallery.addEventListener('scroll', updateNavState);
window.addEventListener('resize', updateNavState);

galleryToggle.addEventListener('click', () => {
  const collapsed = galleryBar.classList.toggle('collapsed');
  galleryToggle.querySelector('.txt').textContent = collapsed ? '展开列表' : '收起列表';
  if (!collapsed) updateNavState();
});

const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');
panelToggle.addEventListener('click', () => {
  const collapsed = panel.classList.toggle('collapsed');
  panelToggle.setAttribute('aria-label', collapsed ? '展开面板' : '折叠面板');
  panelToggle.setAttribute('title', collapsed ? '展开面板' : '折叠面板');
});

function renderGallery() {
  // 重建列表会重置滚动位置，这里保留原来的位置，避免点击图案后列表跳回最左
  const scrollLeft = gallery.scrollLeft;
  gallery.innerHTML = '';
  presets.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item' + (i === activePresetIndex ? ' active' : '');
    item.innerHTML = `<div class="thumb"><img alt="${p.name}"></div><div class="name">${p.name}</div>`;
    item.querySelector('.thumb').style.background = p.color;
    item.querySelector('img').src = p.thumb;
    item.addEventListener('click', () => applyPreset(i));
    gallery.appendChild(item);
  });
  // 先关闭平滑滚动，避免恢复位置时出现从最左滑过去的动画
  gallery.style.scrollBehavior = 'auto';
  gallery.scrollLeft = scrollLeft;
  gallery.style.scrollBehavior = '';
  updateNavState();
}

// ---------- 图案图片缓存 / 预加载 ----------
const imageCache = new Map(); // url -> 已光栅化的 canvas，点列表时可直接使用

function loadImageCanvas(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      if (!w || !h) { reject(new Error('图片尺寸无效')); return; }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas);
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = url;
  });
}

// 预加载列表中其余图案，点按时无需再等网络/解码
function preloadPresets(startIndex) {
  presets.slice(startIndex).forEach((p) => {
    if (imageCache.has(p.url)) return;
    loadImageCanvas(p.url)
      .then((canvas) => imageCache.set(p.url, canvas))
      .catch((err) => console.warn('预加载失败:', p.url, err.message));
  });
}

function applyPreset(index) {
  const p = presets[index];
  activePresetIndex = index;
  renderGallery();

  // 颜色交给切换过场去插值；大小/位置延后到贴图替换时再应用，避免旧图抖动
  colorPicker.value = p.color;
  pendingLayout = { size: p.size, offsetX: p.offsetX, offsetY: p.offsetY };

  const cached = imageCache.get(p.url);
  if (cached) {
    applyImage(cached, p.color);
    return Promise.resolve();
  }
  return loadImageCanvas(p.url)
    .then((canvas) => {
      imageCache.set(p.url, canvas);
      applyImage(canvas, p.color);
    })
    .catch((err) => console.warn('图片加载失败:', p.url, err.message));
}

fetch('./presets.json')
  .then((r) => r.json())
  .then((data) => {
    presets = data;
    renderGallery();
    // 自动加载列表第一个图案（模型未加载完时会先缓存，加载完成后自动应用）
    if (presets.length) applyPreset(0).then(() => preloadPresets(1));
  })
  .catch((err) => console.warn('presets.json 加载失败', err));

uploadInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  activePresetIndex = -1;
  pendingLayout = null;
  renderGallery();
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => applyImage(img);
    img.onerror = () => console.warn('图片解析失败');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  uploadInput.value = '';
});

removeBtn.addEventListener('click', () => {
  activePresetIndex = -1;
  renderGallery();
  removePrint();
});
colorPicker.addEventListener('input', (e) => applyShirtColor(e.target.value));
sizeRange.addEventListener('input', () => { syncValueDisplays(); updatePrintSize(); });
offsetXRange.addEventListener('input', () => { syncValueDisplays(); updatePrintSize(); });
offsetYRange.addEventListener('input', () => { syncValueDisplays(); updatePrintSize(); });
syncValueDisplays();

// ---------- 拖动光源（鼠标/触摸拖拽那个发光小球）----------
const dragRaycaster = new THREE.Raycaster();
const dragPointerNdc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPoint = new THREE.Vector3();
const dragOffset = new THREE.Vector3();
const dragNormal = new THREE.Vector3();
const dragHitSphere = new THREE.Sphere();
let isDraggingLight = false;

function updateDragPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  dragPointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  dragPointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  dragRaycaster.setFromCamera(dragPointerNdc, camera);
}

// 用放大的包围球做命中判定，触摸时也容易点中
function isPointerOnLight() {
  dragHitSphere.set(dragLight.position, DRAG_LIGHT_CONFIG.markerRadius * 2.6);
  return dragRaycaster.ray.intersectsSphere(dragHitSphere);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  updateDragPointer(e);
  if (!isPointerOnLight()) return;

  isDraggingLight = true;
  controls.enabled = false;     // 拖动光源时不要同时旋转场景
  controls.autoRotate = false;
  // 以相机朝向为法线、过光源当前位置的平面作为拖拽平面
  camera.getWorldDirection(dragNormal);
  dragPlane.setFromNormalAndCoplanarPoint(dragNormal.negate(), dragLight.position);
  if (dragRaycaster.ray.intersectPlane(dragPlane, dragPoint)) {
    dragOffset.copy(dragLight.position).sub(dragPoint);
  } else {
    dragOffset.set(0, 0, 0);
  }
  renderer.domElement.setPointerCapture(e.pointerId);
  renderer.domElement.style.cursor = 'grabbing';
});

renderer.domElement.addEventListener('pointermove', (e) => {
  updateDragPointer(e);

  if (isDraggingLight) {
    if (dragRaycaster.ray.intersectPlane(dragPlane, dragPoint)) {
      dragPoint.add(dragOffset);
      // 限制在合理范围内，避免拖到场景外
      dragLight.position.set(
        THREE.MathUtils.clamp(dragPoint.x, -20, 20),
        THREE.MathUtils.clamp(dragPoint.y, -20, 20),
        THREE.MathUtils.clamp(dragPoint.z, -20, 20)
      );
    }
    return;
  }

  renderer.domElement.style.cursor = isPointerOnLight() ? 'grab' : '';
});

function endLightDrag(e) {
  if (!isDraggingLight) return;
  isDraggingLight = false;
  controls.enabled = true;
  renderer.domElement.style.cursor = '';
  if (e && e.pointerId !== undefined) {
    try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  // 拖动结束后输出当前光源位置，方便提取到 DRAG_LIGHT_CONFIG.position
  const p = dragLight.position;
  console.log(`光源位置 position: { x: ${p.x.toFixed(2)}, y: ${p.y.toFixed(2)}, z: ${p.z.toFixed(2)} }`);
}
renderer.domElement.addEventListener('pointerup', endLightDrag);
renderer.domElement.addEventListener('pointercancel', endLightDrag);

// 控制台辅助：随时查看当前光源位置
window.getLightPosition = () => {
  const p = dragLight.position;
  const str = `position: { x: ${p.x.toFixed(2)}, y: ${p.y.toFixed(2)}, z: ${p.z.toFixed(2)} }`;
  console.log(str);
  return { x: p.x, y: p.y, z: p.z };
};

// ---------- 循环 / 自适应 ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  handleViewportChange(); // 跨越移动端断点时重新取景
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  updateFade(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
